<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09051d"/>
      <stop offset="50%" stop-color="#190a42"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="portalBeam" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#190a42" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg8)"/>
  <rect width="1200" height="675" fill="url(#portalBeam)"/>

  <!-- Background Glowing Cyber/Magic Grid -->
  <g opacity="0.3">
    <path d="M0 500 L1200 500 M0 550 L1200 550 M0 600 L1200 600" stroke="#a855f7" stroke-width="1.5"/>
    <path d="M200 450 L100 675 M400 450 L300 675 M600 450 L600 675 M800 450 L900 675 M1000 450 L1100 675" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- GRAND FACTOR LAB PORTAL GATE -->
  <g transform="translate(600, 220)" filter="url(#intenseGlow8)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="16,10"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="130" fill="#2e1065" stroke="#ec4899" stroke-width="3"/>

    <!-- Portal Title -->
    <text x="0" y="-30" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="34" fill="#fde047" text-anchor="middle">THE FACTOR LAB</text>
    <text x="0" y="20" font-family="sans-serif" font-weight="900" font-size="22" fill="#a5f3fc" text-anchor="middle">🧪 INTERACTIVE QUEST 🧪</text>
  </g>

  <!-- Floating Hologram Badges for 4 Methods -->
  <g transform="translate(180, 160)" filter="url(#glow8)">
    <rect x="-100" y="-30" width="200" height="60" rx="14" fill="#1e1045" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="18" fill="#38bdf8" text-anchor="middle">1. Common Factor</text>
  </g>
  <g transform="translate(1020, 160)" filter="url(#glow8)">
    <rect x="-100" y="-30" width="200" height="60" rx="14" fill="#1e1045" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="18" fill="#34d399" text-anchor="middle">2. Grouping</text>
  </g>
  <g transform="translate(180, 320)" filter="url(#glow8)">
    <rect x="-100" y="-30" width="200" height="60" rx="14" fill="#1e1045" stroke="#f472b6" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="18" fill="#f472b6" text-anchor="middle">3. Two Squares</text>
  </g>
  <g transform="translate(1020, 320)" filter="url(#glow8)">
    <rect x="-100" y="-30" width="200" height="60" rx="14" fill="#1e1045" stroke="#fde047" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="18" fill="#fde047" text-anchor="middle">4. Sum &amp; Product</text>
  </g>

  <!-- LEO THE ANIME LION WIZARD IN CENTER FRONT -->
  <g transform="translate(600, 470)">
    <!-- Robe -->
    <path d="M-110 160 L-70 20 L70 20 L110 160 Z" fill="#190a42" stroke="#facc15" stroke-width="3"/>
    <!-- Mane -->
    <path d="M-105 -25 C-135 -80 -75 -150 0 -160 C75 -150 135 -80 105 -25 C120 35 60 90 0 90 C-60 90 -120 35 -105 -25 Z" fill="#facc15"/>
    <ellipse cx="0" cy="-30" rx="55" ry="45" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-55" cy="-75" r="9" fill="#f43f5e"/>
    <circle cx="55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="55" cy="-75" r="9" fill="#f43f5e"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="-27" cy="-42" r="4" fill="#fff"/>
    <ellipse cx="24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="21" cy="-42" r="4" fill="#fff"/>
    <circle cx="-24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 Q0 -18 75 0 L45 -90 Q0 -110 -45 -90 Z" fill="#3b0764" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-55 3,-45 12,-45 5,-39 8,-29 0,-35 -8,-29 -5,-39 -12,-45 -3,-45" fill="#facc15" filter="url(#glow8)"/>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(250, 590)" filter="url(#glow8)">
    <rect x="0" y="0" width="700" height="55" rx="28" fill="#160b36" stroke="#facc15" stroke-width="3"/>
    <text x="350" y="36" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#fde047" text-anchor="middle">🚀 You're Ready! Step into the Lab &amp; Become a Factor Detective! 🚀</text>
  </g>
</svg>