<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)"/>
  <rect width="1200" height="675" fill="url(#emeraldGlow)"/>

  <!-- Background Particles -->
  <g opacity="0.6">
    <circle cx="120" cy="120" r="4" fill="#6ee7b7" filter="url(#glow4)"/>
    <circle cx="1080" cy="100" r="5" fill="#facc15" filter="url(#glow4)"/>
    <circle cx="150" cy="540" r="3" fill="#38bdf8" filter="url(#glow4)"/>
    <circle cx="1020" cy="520" r="4" fill="#a7f3d0" filter="url(#glow4)"/>
  </g>

  <!-- STEP 1: 4 Terms grouped into pairs -->
  <g transform="translate(200, 150)">
    <rect x="-140" y="-80" width="280" height="230" rx="20" fill="#064e3b" stroke="#34d399" stroke-width="2" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="20" fill="#a7f3d0" text-anchor="middle">STEP 1: GROUP IN PAIRS</text>

    <!-- Pair 1 -->
    <rect x="-120" y="-20" width="110" height="50" rx="12" fill="#047857" stroke="#6ee7b7" stroke-width="2"/>
    <text x="-65" y="12" font-family="sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">xy + 3x</text>

    <!-- Pair 2 -->
    <rect x="10" y="-20" width="110" height="50" rx="12" fill="#047857" stroke="#6ee7b7" stroke-width="2"/>
    <text x="65" y="12" font-family="sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">2y + 6</text>

    <path d="M0 45 L0 80" stroke="#facc15" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="0,90 -6,75 6,75" fill="#facc15"/>
    <text x="0" y="120" font-family="sans-serif" font-weight="900" font-size="20" fill="#fde047" text-anchor="middle">x(y + 3) + 2(y + 3)</text>
  </g>

  <!-- MATCHING PUZZLE HIGHLIGHT IN CENTER -->
  <g transform="translate(600, 160)" filter="url(#intenseGlow4)">
    <rect x="-150" y="-60" width="300" height="120" rx="24" fill="#065f46" stroke="#facc15" stroke-width="4"/>
    <text x="0" y="-20" font-family="sans-serif" font-weight="900" font-size="18" fill="#fde047" text-anchor="middle">MATCHING BRACKETS!</text>
    <text x="0" y="25" font-family="sans-serif" font-weight="900" font-size="36" fill="#fff" text-anchor="middle">(y + 3)</text>
  </g>

  <!-- STEP 2: Final Factorised Product -->
  <g transform="translate(1000, 150)">
    <rect x="-140" y="-80" width="280" height="230" rx="20" fill="#064e3b" stroke="#34d399" stroke-width="2" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="20" fill="#a7f3d0" text-anchor="middle">STEP 2: TAKE COMMON</text>

    <g transform="translate(0, 30)" filter="url(#intenseGlow4)">
      <rect x="-120" y="-40" width="240" height="80" rx="16" fill="#047857" stroke="#34d399" stroke-width="3"/>
      <text x="0" y="12" font-family="sans-serif" font-weight="900" font-size="30" fill="#fff" text-anchor="middle">(x + 2)(y + 3)</text>
    </g>
  </g>

  <!-- LEO THE ANIME LION WIZARD -->
  <g transform="translate(600, 470)">
    <!-- Robe -->
    <path d="M-110 160 L-70 20 L70 20 L110 160 Z" fill="#064e3b" stroke="#facc15" stroke-width="3"/>
    <!-- Mane -->
    <path d="M-105 -25 C-135 -80 -75 -150 0 -160 C75 -150 135 -80 105 -25 C120 35 60 90 0 90 C-60 90 -120 35 -105 -25 Z" fill="#facc15"/>
    <ellipse cx="0" cy="-30" rx="55" ry="45" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-55" cy="-75" r="9" fill="#f43f5e"/>
    <circle cx="55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="55" cy="-75" r="9" fill="#f43f5e"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="-27" cy="-42" r="4" fill="#fff"/>
    <ellipse cx="24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="21" cy="-42" r="4" fill="#fff"/>
    <circle cx="-24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 Q0 -18 75 0 L45 -90 Q0 -110 -45 -90 Z" fill="#065f46" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-55 3,-45 12,-45 5,-39 8,-29 0,-35 -8,-29 -5,-39 -12,-45 -3,-45" fill="#facc15" filter="url(#glow4)"/>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(250, 590)" filter="url(#glow4)">
    <rect x="0" y="0" width="700" height="55" rx="28" fill="#022c22" stroke="#34d399" stroke-width="3"/>
    <text x="350" y="36" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#a7f3d0" text-anchor="middle">🧩 Method 2: Group four terms into pairs with matching brackets!</text>
  </g>
</svg>