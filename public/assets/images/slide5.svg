<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    <radialGradient id="cyanFlare" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg5)"/>
  <rect width="1200" height="675" fill="url(#cyanFlare)"/>

  <!-- Background Magic Symbols -->
  <g opacity="0.6">
    <circle cx="140" cy="110" r="4" fill="#38bdf8" filter="url(#glow5)"/>
    <circle cx="1060" cy="130" r="5" fill="#f43f5e" filter="url(#glow5)"/>
    <circle cx="180" cy="540" r="3" fill="#facc15" filter="url(#glow5)"/>
    <circle cx="1020" cy="520" r="4" fill="#c084fc" filter="url(#glow5)"/>
  </g>

  <!-- LEFT: Difference of Two Squares Formula -->
  <g transform="translate(250, 150)">
    <rect x="-160" y="-80" width="320" height="230" rx="20" fill="#1e1045" stroke="#f43f5e" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="22" fill="#f472b6" text-anchor="middle">DIFFERENCE OF TWO SQUARES</text>

    <!-- Expression x² - 49 -->
    <g transform="translate(0, 10)">
      <rect x="-130" y="-35" width="260" height="70" rx="16" fill="#881337" stroke="#fb7185" stroke-width="3" filter="url(#intenseGlow5)"/>
      <text x="0" y="12" font-family="sans-serif" font-weight="900" font-size="38" fill="#fff" text-anchor="middle">x² − 49</text>
    </g>

    <text x="0" y="115" font-family="sans-serif" font-weight="900" font-size="18" fill="#fde047" text-anchor="middle">Note: 49 is a perfect square (7²)</text>
  </g>

  <!-- CENTER LIGHTNING SPLIT -->
  <g transform="translate(600, 180)" filter="url(#intenseGlow5)">
    <path d="M-20 -90 L30 -10 L-10 10 L40 90" stroke="#facc15" stroke-width="6" fill="none"/>
    <text x="0" y="115" font-family="sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle">SPLITS INTO</text>
  </g>

  <!-- RIGHT: Twin Factor Blades (x - 7)(x + 7) -->
  <g transform="translate(950, 150)">
    <rect x="-170" y="-80" width="340" height="230" rx="20" fill="#1e1045" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="22" fill="#38bdf8" text-anchor="middle">TWIN FACTORS (PLUS &amp; MINUS)</text>

    <g transform="translate(0, 20)" filter="url(#intenseGlow5)">
      <rect x="-150" y="-35" width="300" height="70" rx="16" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/>
      <text x="0" y="12" font-family="sans-serif" font-weight="900" font-size="34" fill="#fff" text-anchor="middle">(x − 7)(x + 7)</text>
    </g>
  </g>

  <!-- LEO THE ANIME LION WIZARD -->
  <g transform="translate(600, 470)">
    <!-- Robe -->
    <path d="M-110 160 L-70 20 L70 20 L110 160 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="3"/>
    <!-- Mane -->
    <path d="M-105 -25 C-135 -80 -75 -150 0 -160 C75 -150 135 -80 105 -25 C120 35 60 90 0 90 C-60 90 -120 35 -105 -25 Z" fill="#facc15"/>
    <ellipse cx="0" cy="-30" rx="55" ry="45" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-55" cy="-75" r="9" fill="#f43f5e"/>
    <circle cx="55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="55" cy="-75" r="9" fill="#f43f5e"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="-27" cy="-42" r="4" fill="#fff"/>
    <ellipse cx="24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="21" cy="-42" r="4" fill="#fff"/>
    <circle cx="-24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 Q0 -18 75 0 L45 -90 Q0 -110 -45 -90 Z" fill="#311b92" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-55 3,-45 12,-45 5,-39 8,-29 0,-35 -8,-29 -5,-39 -12,-45 -3,-45" fill="#facc15" filter="url(#glow5)"/>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(250, 590)" filter="url(#glow5)">
    <rect x="0" y="0" width="700" height="55" rx="28" fill="#1e1b4b" stroke="#f43f5e" stroke-width="3"/>
    <text x="350" y="36" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#fde047" text-anchor="middle">⚡ Method 3: a² − b² = (a − b)(a + b) (Middle terms cancel!)</text>
  </g>
</svg>