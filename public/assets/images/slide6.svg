<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg6)"/>
  <rect width="1200" height="675" fill="url(#pinkGlow)"/>

  <!-- Background Magic Sparks -->
  <g opacity="0.6">
    <circle cx="150" cy="110" r="4" fill="#facc15" filter="url(#glow6)"/>
    <circle cx="1050" cy="130" r="5" fill="#38bdf8" filter="url(#glow6)"/>
    <circle cx="180" cy="540" r="3" fill="#f43f5e" filter="url(#glow6)"/>
    <circle cx="1020" cy="520" r="4" fill="#a7f3d0" filter="url(#glow6)"/>
  </g>

  <!-- LEFT: Trinomial Expression -->
  <g transform="translate(220, 160)">
    <rect x="-140" y="-80" width="280" height="230" rx="20" fill="#3b0764" stroke="#c084fc" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="20" fill="#e9d5ff" text-anchor="middle">TRINOMIAL TO FACTORISE</text>

    <g transform="translate(0, 10)">
      <rect x="-120" y="-35" width="240" height="70" rx="16" fill="#581c87" stroke="#d8b4fe" stroke-width="3" filter="url(#intenseGlow6)"/>
      <text x="0" y="12" font-family="sans-serif" font-weight="900" font-size="32" fill="#fff" text-anchor="middle">x² + 7x + 12</text>
    </g>
  </g>

  <!-- CENTER: Sum & Product Magic Recipe -->
  <g transform="translate(600, 160)">
    <!-- Recipe Card -->
    <rect x="-180" y="-80" width="360" height="230" rx="20" fill="#1e1045" stroke="#facc15" stroke-width="3" filter="url(#intenseGlow6)"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle">MAGIC FACTOR PAIR (3 &amp; 4)</text>

    <g transform="translate(-80, 15)">
      <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="-5" font-family="sans-serif" font-weight="900" font-size="16" fill="#7dd3fc" text-anchor="middle">PRODUCT (c)</text>
      <text x="0" y="20" font-family="sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">3 × 4 = 12</text>
    </g>
    <g transform="translate(80, 15)">
      <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#047857" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="-5" font-family="sans-serif" font-weight="900" font-size="16" fill="#6ee7b7" text-anchor="middle">SUM (b)</text>
      <text x="0" y="20" font-family="sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">3 + 4 = 7</text>
    </g>
  </g>

  <!-- RIGHT: Solution (x+3)(x+4) -->
  <g transform="translate(980, 160)">
    <rect x="-140" y="-80" width="280" height="230" rx="20" fill="#3b0764" stroke="#f472b6" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="20" fill="#f472b6" text-anchor="middle">FACTORISED SOLUTION</text>

    <g transform="translate(0, 10)" filter="url(#intenseGlow6)">
      <rect x="-120" y="-35" width="240" height="70" rx="16" fill="#831843" stroke="#f472b6" stroke-width="3"/>
      <text x="0" y="12" font-family="sans-serif" font-weight="900" font-size="30" fill="#fff" text-anchor="middle">(x + 3)(x + 4)</text>
    </g>
  </g>

  <!-- LEO THE ANIME LION WIZARD -->
  <g transform="translate(600, 470)">
    <!-- Robe -->
    <path d="M-110 160 L-70 20 L70 20 L110 160 Z" fill="#3b0764" stroke="#facc15" stroke-width="3"/>
    <!-- Mane -->
    <path d="M-105 -25 C-135 -80 -75 -150 0 -160 C75 -150 135 -80 105 -25 C120 35 60 90 0 90 C-60 90 -120 35 -105 -25 Z" fill="#facc15"/>
    <ellipse cx="0" cy="-30" rx="55" ry="45" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-55" cy="-75" r="9" fill="#f43f5e"/>
    <circle cx="55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="55" cy="-75" r="9" fill="#f43f5e"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="-27" cy="-42" r="4" fill="#fff"/>
    <ellipse cx="24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="21" cy="-42" r="4" fill="#fff"/>
    <circle cx="-24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 Q0 -18 75 0 L45 -90 Q0 -110 -45 -90 Z" fill="#6b21a8" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-55 3,-45 12,-45 5,-39 8,-29 0,-35 -8,-29 -5,-39 -12,-45 -3,-45" fill="#facc15" filter="url(#glow6)"/>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(250, 590)" filter="url(#glow6)">
    <rect x="0" y="0" width="700" height="55" rx="28" fill="#4c1d95" stroke="#facc15" stroke-width="3"/>
    <text x="350" y="36" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#fde047" text-anchor="middle">🧪 Method 4: Find numbers that MULTIPLY to c and ADD to b!</text>
  </g>
</svg>