<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="skyLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow7" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg7)"/>
  <rect width="1200" height="675" fill="url(#skyLight)"/>

  <!-- Background Magic Symbols -->
  <g opacity="0.6">
    <circle cx="150" cy="110" r="4" fill="#facc15" filter="url(#glow7)"/>
    <circle cx="1050" cy="130" r="5" fill="#38bdf8" filter="url(#glow7)"/>
    <circle cx="180" cy="540" r="3" fill="#f43f5e" filter="url(#glow7)"/>
    <circle cx="1020" cy="520" r="4" fill="#a7f3d0" filter="url(#glow7)"/>
  </g>

  <!-- LEFT: Perfect Square Trinomial -->
  <g transform="translate(250, 160)">
    <rect x="-160" y="-80" width="320" height="230" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="22" fill="#7dd3fc" text-anchor="middle">PERFECT SQUARE TRINOMIAL</text>

    <g transform="translate(0, -5)">
      <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="24" fill="#fde047" text-anchor="middle">x² + 6x + 9</text>
      <text x="0" y="30" font-family="sans-serif" font-weight="900" font-size="20" fill="#a5f3fc" text-anchor="middle">=</text>
      <g filter="url(#intenseGlow7)">
        <rect x="-100" y="45" width="200" height="60" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
        <text x="0" y="85" font-family="sans-serif" font-weight="900" font-size="32" fill="#fff" text-anchor="middle">(x + 3)²</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: Sign Rules Card -->
  <g transform="translate(950, 160)">
    <rect x="-160" y="-80" width="320" height="230" rx="20" fill="#0f172a" stroke="#facc15" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="-45" font-family="sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle">SIGN RULES CHEAT CODE</text>

    <g transform="translate(0, 10)">
      <rect x="-140" y="-30" width="280" height="45" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
      <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="18" fill="#4ade80" text-anchor="middle">+c  →  SAME SIGNS (both + or both -)</text>

      <rect x="-140" y="25" width="280" height="45" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
      <text x="0" y="55" font-family="sans-serif" font-weight="900" font-size="18" fill="#f43f5e" text-anchor="middle">−c  →  OPPOSITE SIGNS (+ and -)</text>
    </g>
  </g>

  <!-- LEO THE ANIME LION WIZARD -->
  <g transform="translate(600, 470)">
    <!-- Robe -->
    <path d="M-110 160 L-70 20 L70 20 L110 160 Z" fill="#0369a1" stroke="#facc15" stroke-width="3"/>
    <!-- Mane -->
    <path d="M-105 -25 C-135 -80 -75 -150 0 -160 C75 -150 135 -80 105 -25 C120 35 60 90 0 90 C-60 90 -120 35 -105 -25 Z" fill="#facc15"/>
    <ellipse cx="0" cy="-30" rx="55" ry="45" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-55" cy="-75" r="9" fill="#f43f5e"/>
    <circle cx="55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="55" cy="-75" r="9" fill="#f43f5e"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="-27" cy="-42" r="4" fill="#fff"/>
    <ellipse cx="24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="21" cy="-42" r="4" fill="#fff"/>
    <circle cx="-24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 Q0 -18 75 0 L45 -90 Q0 -110 -45 -90 Z" fill="#0f172a" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-55 3,-45 12,-45 5,-39 8,-29 0,-35 -8,-29 -5,-39 -12,-45 -3,-45" fill="#facc15" filter="url(#glow7)"/>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(250, 590)" filter="url(#glow7)">
    <rect x="0" y="0" width="700" height="55" rx="28" fill="#0369a1" stroke="#facc15" stroke-width="3"/>
    <text x="350" y="36" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#fde047" text-anchor="middle">✨ Perfect Squares: a² ± 2ab + b² = (a ± b)²</text>
  </g>
</svg>