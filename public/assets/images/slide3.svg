<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <radialGradient id="goldBeam" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <rect width="1200" height="675" fill="url(#goldBeam)"/>

  <!-- Background Magic Sparks -->
  <g opacity="0.6">
    <circle cx="150" cy="100" r="4" fill="#facc15" filter="url(#glow3)"/>
    <circle cx="1050" cy="150" r="5" fill="#e879f9" filter="url(#glow3)"/>
    <circle cx="220" cy="520" r="3.5" fill="#38bdf8" filter="url(#glow3)"/>
    <circle cx="1000" cy="540" r="4" fill="#4ade80" filter="url(#glow3)"/>
  </g>

  <!-- LEFT: Magical Chest 6x + 9 -->
  <g transform="translate(260, 240)">
    <!-- Chest Base -->
    <rect x="-140" y="-40" width="280" height="180" rx="18" fill="#78350f" stroke="#facc15" stroke-width="4"/>
    <rect x="-130" y="-30" width="260" height="50" rx="10" fill="#92400e"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="34" fill="#fff" text-anchor="middle" filter="url(#glow3)">6x + 9</text>

    <!-- Glowing Keyhole -->
    <circle cx="0" cy="65" r="28" fill="#1e1b4b" stroke="#fde047" stroke-width="3"/>
    <polygon points="0,55 -12,85 12,85" fill="#fde047"/>
  </g>

  <!-- CENTER: Glowing Golden Key 3 (Common Factor) -->
  <g transform="translate(560, 260) rotate(-15)" filter="url(#intenseGlow3)">
    <!-- Key Shaft & Teeth -->
    <rect x="0" y="-12" width="160" height="24" rx="6" fill="#facc15" stroke="#fff" stroke-width="2"/>
    <rect x="120" y="12" width="20" height="30" fill="#facc15"/>
    <rect x="90" y="12" width="16" height="22" fill="#facc15"/>

    <!-- Key Handle (Number 3 Ring) -->
    <circle cx="-35" cy="0" r="45" fill="#d97706" stroke="#fde047" stroke-width="4"/>
    <circle cx="-35" cy="0" r="30" fill="#facc15"/>
    <text x="-35" y="12" font-family="sans-serif" font-weight="900" font-size="38" fill="#78350f" text-anchor="middle">3</text>
  </g>

  <!-- RIGHT: Unlocked Expression 3(2x + 3) -->
  <g transform="translate(900, 230)">
    <rect x="-160" y="-100" width="320" height="230" rx="24" fill="#1e1045" stroke="#f472b6" stroke-width="3" filter="url(#intenseGlow3)"/>
    <text x="0" y="-55" font-family="sans-serif" font-weight="900" font-size="22" fill="#f472b6" text-anchor="middle">FACTORISED FORM</text>

    <g transform="translate(0, 10)">
      <rect x="-130" y="-35" width="260" height="70" rx="16" fill="#701a75" stroke="#f0abfc" stroke-width="3"/>
      <text x="0" y="10" font-family="sans-serif" font-weight="900" font-size="36" fill="#fff" text-anchor="middle">3(2x + 3)</text>
    </g>

    <!-- Expansion Checkmark -->
    <rect x="-120" y="70" width="240" height="35" rx="10" fill="#065f46"/>
    <text x="0" y="93" font-family="sans-serif" font-weight="900" font-size="16" fill="#6ee7b7" text-anchor="middle">Check: 3(2x) + 3(3) = 6x + 9 ✓</text>
  </g>

  <!-- LEO THE ANIME LION WIZARD -->
  <g transform="translate(560, 480)">
    <!-- Robe -->
    <path d="M-110 160 L-70 20 L70 20 L110 160 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="3"/>
    <!-- Mane -->
    <path d="M-105 -25 C-135 -80 -75 -150 0 -160 C75 -150 135 -80 105 -25 C120 35 60 90 0 90 C-60 90 -120 35 -105 -25 Z" fill="#facc15"/>
    <ellipse cx="0" cy="-30" rx="55" ry="45" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-55" cy="-75" r="9" fill="#f43f5e"/>
    <circle cx="55" cy="-75" r="18" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="55" cy="-75" r="9" fill="#f43f5e"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="-27" cy="-42" r="4" fill="#fff"/>
    <ellipse cx="24" cy="-38" rx="12" ry="16" fill="#0f172a"/>
    <circle cx="21" cy="-42" r="4" fill="#fff"/>
    <circle cx="-24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="24" cy="-36" r="18" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -85)">
      <path d="M-75 0 Q0 -18 75 0 L45 -90 Q0 -110 -45 -90 Z" fill="#3b0764" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-55 3,-45 12,-45 5,-39 8,-29 0,-35 -8,-29 -5,-39 -12,-45 -3,-45" fill="#facc15" filter="url(#glow3)"/>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(250, 590)" filter="url(#glow3)">
    <rect x="0" y="0" width="700" height="55" rx="28" fill="#160b36" stroke="#facc15" stroke-width="3"/>
    <text x="350" y="36" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#fde047" text-anchor="middle">🔑 Method 1: Pull out the HCF first, then write remaining terms in brackets!</text>
  </g>
</svg>