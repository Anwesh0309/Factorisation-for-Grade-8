<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d2a"/>
      <stop offset="50%" stop-color="#181745"/>
      <stop offset="100%" stop-color="#2a1052"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect width="1200" height="675" fill="url(#cyanGlow)"/>
  <rect width="1200" height="675" fill="url(#purpleGlow)"/>

  <!-- Background Anime Particles -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="4" fill="#38bdf8" filter="url(#glow2)"/>
    <circle cx="1100" cy="120" r="5" fill="#facc15" filter="url(#glow2)"/>
    <circle cx="200" cy="550" r="3" fill="#c084fc" filter="url(#glow2)"/>
    <circle cx="1050" cy="530" r="4" fill="#34d399" filter="url(#glow2)"/>
  </g>

  <!-- LEFT CRYSTAL: 6x² -->
  <g transform="translate(180, 140)">
    <rect x="-110" y="-80" width="220" height="260" rx="20" fill="#0f172a" stroke="#0284c7" stroke-width="2" opacity="0.85"/>
    <g filter="url(#intenseGlow2)">
      <polygon points="0,-60 50,-10 30,70 -30,70 -50,-10" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
      <text x="0" y="-5" font-family="sans-serif" font-weight="900" font-size="36" fill="#fff" text-anchor="middle">6x²</text>
    </g>
    <!-- Factor Decomposition -->
    <rect x="-90" y="90" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="115" font-family="sans-serif" font-weight="900" font-size="20" fill="#38bdf8" text-anchor="middle">Factors:</text>
    <text x="0" y="140" font-family="sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle">2 × <tspan fill="#4ade80">3</tspan> × <tspan fill="#4ade80">x</tspan> × x</text>
  </g>

  <!-- RIGHT CRYSTAL: 9x -->
  <g transform="translate(1020, 140)">
    <rect x="-110" y="-80" width="220" height="260" rx="20" fill="#0f172a" stroke="#a855f7" stroke-width="2" opacity="0.85"/>
    <g filter="url(#intenseGlow2)">
      <polygon points="0,-60 50,-10 30,70 -30,70 -50,-10" fill="#7e22ce" stroke="#c084fc" stroke-width="3"/>
      <text x="0" y="-5" font-family="sans-serif" font-weight="900" font-size="36" fill="#fff" text-anchor="middle">9x</text>
    </g>
    <!-- Factor Decomposition -->
    <rect x="-90" y="90" width="180" height="60" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="0" y="115" font-family="sans-serif" font-weight="900" font-size="20" fill="#c084fc" text-anchor="middle">Factors:</text>
    <text x="0" y="140" font-family="sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle"><tspan fill="#4ade80">3</tspan> × 3 × <tspan fill="#4ade80">x</tspan></text>
  </g>

  <!-- Center Golden Extraction Beams -->
  <path d="M270 200 Q 400 320 600 320" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8,6" filter="url(#glow2)"/>
  <path d="M930 200 Q 800 320 600 320" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8,6" filter="url(#glow2)"/>

  <!-- CENTER ORB: Highest Common Factor (3x) -->
  <g transform="translate(600, 160)" filter="url(#intenseGlow2)">
    <circle cx="0" cy="0" r="70" fill="#047857" stroke="#34d399" stroke-width="4"/>
    <circle cx="0" cy="0" r="55" fill="#10b981"/>
    <text x="0" y="-12" font-family="sans-serif" font-weight="900" font-size="18" fill="#a7f3d0" text-anchor="middle">SHARED HCF</text>
    <text x="0" y="24" font-family="sans-serif" font-weight="900" font-size="44" fill="#fff" text-anchor="middle">3x</text>
  </g>

  <!-- CENTER: Leo the Anime Lion Wizard -->
  <g transform="translate(600, 460)">
    <!-- Wizard Robe -->
    <path d="M-120 180 L-75 30 L75 30 L120 180 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="3"/>

    <!-- Lion Mane -->
    <path d="M-115 -20 C-145 -80 -85 -160 0 -170 C85 -160 145 -80 115 -20 C130 40 70 100 0 100 C-70 100 -130 40 -115 -20 Z" fill="#facc15"/>
    <path d="M-95 -80 L-65 -120 L-35 -90 L0 -130 L35 -90 L65 -120 L95 -80" stroke="#fde047" stroke-width="4" fill="none"/>

    <!-- Face -->
    <ellipse cx="0" cy="-30" rx="60" ry="50" fill="#fef08a"/>

    <!-- Ears -->
    <circle cx="-60" cy="-80" r="20" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-60" cy="-80" r="10" fill="#f43f5e"/>
    <circle cx="60" cy="-80" r="20" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="60" cy="-80" r="10" fill="#f43f5e"/>

    <!-- Snout & Mouth -->
    <ellipse cx="0" cy="-15" rx="26" ry="18" fill="#fff"/>
    <polygon points="0,-20 -7,-27 7,-27" fill="#f43f5e"/>
    <path d="M-7 -12 Q0 -4 7 -12" fill="none" stroke="#881337" stroke-width="3"/>

    <!-- Anime Eyes & Glasses -->
    <ellipse cx="-26" cy="-42" rx="14" ry="18" fill="#0f172a"/>
    <circle cx="-30" cy="-46" r="5" fill="#fff"/>
    <ellipse cx="26" cy="-42" rx="14" ry="18" fill="#0f172a"/>
    <circle cx="22" cy="-46" r="5" fill="#fff"/>
    <circle cx="-26" cy="-40" r="20" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="26" cy="-40" r="20" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Wizard Hat -->
    <g transform="translate(0, -90)">
      <path d="M-80 0 Q0 -20 80 0 L50 -100 Q0 -120 -50 -100 Z" fill="#2e1065" stroke="#facc15" stroke-width="3"/>
      <polygon points="0,-60 3,-50 12,-50 5,-44 8,-34 0,-40 -8,-34 -5,-44 -12,-50 -3,-50" fill="#facc15" filter="url(#glow2)"/>
    </g>
  </g>

  <!-- Bottom Quote Banner -->
  <g transform="translate(250, 580)" filter="url(#glow2)">
    <rect x="0" y="0" width="700" height="60" rx="30" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <text x="350" y="38" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#a7f3d0" text-anchor="middle">🔍 Highest Common Factor (HCF) of 6x² and 9x is 3x!</text>
  </g>
</svg>