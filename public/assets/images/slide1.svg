<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728"/>
      <stop offset="50%" stop-color="#1b0e4b"/>
      <stop offset="100%" stop-color="#2a085c"/>
    </linearGradient>
    <radialGradient id="nebulaBlue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaGold" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#nebulaBlue)"/>
  <rect width="1200" height="675" fill="url(#nebulaGold)"/>

  <!-- Background Anime Magic Sparks -->
  <g opacity="0.6">
    <circle cx="150" cy="120" r="3" fill="#fff" filter="url(#glow)"/>
    <circle cx="280" cy="80" r="4.5" fill="#fde047" filter="url(#glow)"/>
    <circle cx="1050" cy="140" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="980" cy="90" r="3" fill="#fff"/>
    <circle cx="110" cy="520" r="3.5" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="1080" cy="540" r="4" fill="#facc15" filter="url(#glow)"/>
    <!-- Floating Math Symbols -->
    <text x="120" y="200" font-family="sans-serif" font-weight="900" font-size="28" fill="#38bdf8" opacity="0.4">×</text>
    <text x="1000" y="220" font-family="sans-serif" font-weight="900" font-size="32" fill="#facc15" opacity="0.4">=</text>
    <text x="180" y="480" font-family="sans-serif" font-weight="900" font-size="30" fill="#a7f3d0" opacity="0.3">+</text>
    <text x="1020" y="460" font-family="sans-serif" font-weight="900" font-size="28" fill="#f472b6" opacity="0.4">÷</text>
  </g>

  <!-- LEFT SIDE: Building (x+2)(x+3) -> Castle x² + 5x + 6 -->
  <g transform="translate(60, 80)">
    <!-- Aura Plate -->
    <rect x="0" y="0" width="340" height="420" rx="24" fill="#1e1045" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <text x="170" y="45" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#38bdf8" text-anchor="middle">BUILDING (EXPANDING)</text>

    <!-- Factor Blocks (x+2) and (x+3) -->
    <g transform="translate(40, 80)" filter="url(#glow)">
      <rect x="0" y="0" width="110" height="50" rx="10" fill="#0284c7" stroke="#7dd3fc" stroke-width="2"/>
      <text x="55" y="32" font-family="sans-serif" font-weight="900" font-size="20" fill="#fff" text-anchor="middle">(x + 2)</text>
    </g>
    <g transform="translate(190, 80)" filter="url(#glow)">
      <rect x="0" y="0" width="110" height="50" rx="10" fill="#0284c7" stroke="#7dd3fc" stroke-width="2"/>
      <text x="55" y="32" font-family="sans-serif" font-weight="900" font-size="20" fill="#fff" text-anchor="middle">(x + 3)</text>
    </g>

    <text x="170" y="170" font-family="sans-serif" font-weight="900" font-size="28" fill="#facc15" text-anchor="middle">MULTIPLY</text>
    <path d="M170 185 L170 225" stroke="#facc15" stroke-width="4" stroke-dasharray="6,4" filter="url(#glow)"/>
    <polygon points="170,235 162,220 178,220" fill="#facc15"/>

    <!-- Glowing Math Castle -->
    <g transform="translate(65, 245)" filter="url(#intenseGlow)">
      <path d="M20 130 L20 60 L40 40 L60 60 L80 30 L100 60 L120 40 L140 60 L140 130 Z" fill="#7c3aed" stroke="#c084fc" stroke-width="3"/>
      <rect x="70" y="85" width="30" height="45" rx="15" fill="#fde047"/>
      <text x="100" y="165" font-family="sans-serif" font-weight="900" font-size="24" fill="#38bdf8" text-anchor="middle">x² + 5x + 6</text>
    </g>
  </g>

  <!-- CENTER: Leo the Anime Lion Wizard -->
  <g transform="translate(600, 340)">
    <!-- Magic Circle behind Leo -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#facc15" stroke-width="2" opacity="0.3" stroke-dasharray="12,8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

    <!-- Wizard Robe -->
    <path d="M-110 220 L-70 60 L70 60 L110 220 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="3"/>
    <path d="M-40 60 L0 180 L40 60" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- Lion Mane Layer 1 (Outer dark golden) -->
    <path d="M-120 10 C-150 -50 -90 -140 0 -150 C90 -140 150 -50 120 10 C140 70 80 130 0 130 C-80 130 -140 70 -120 10 Z" fill="#b45309"/>

    <!-- Lion Mane Layer 2 (Bright anime gold spikes) -->
    <path d="M-105 0 C-130 -40 -80 -125 0 -135 C80 -125 130 -40 105 0 C120 50 70 110 0 110 C-70 110 -120 50 -105 0 Z" fill="#facc15"/>
    <path d="M-90 -70 L-60 -110 L-30 -80 L0 -120 L30 -80 L60 -110 L90 -70" stroke="#fde047" stroke-width="4" fill="none"/>

    <!-- Face Base -->
    <ellipse cx="0" cy="-10" rx="65" ry="55" fill="#fef08a"/>

    <!-- Anime Ears -->
    <circle cx="-65" cy="-65" r="22" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="-65" cy="-65" r="12" fill="#f43f5e"/>
    <circle cx="65" cy="-65" r="22" fill="#facc15" stroke="#b45309" stroke-width="3"/>
    <circle cx="65" cy="-65" r="12" fill="#f43f5e"/>

    <!-- Cute Snout & Blush -->
    <ellipse cx="0" cy="5" rx="28" ry="20" fill="#fff"/>
    <polygon points="0,0 -8,-8 8,-8" fill="#f43f5e"/>
    <path d="M-8 8 Q0 16 8 8" fill="none" stroke="#881337" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-40" cy="5" rx="12" ry="6" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="40" cy="5" rx="12" ry="6" fill="#fb7185" opacity="0.6"/>

    <!-- Big Sparkling Anime Eyes -->
    <ellipse cx="-28" cy="-25" rx="15" ry="20" fill="#0f172a"/>
    <ellipse cx="-28" cy="-25" rx="11" ry="15" fill="#0284c7"/>
    <circle cx="-32" cy="-30" r="5" fill="#fff"/>
    <circle cx="-24" cy="-18" r="2.5" fill="#fff"/>

    <ellipse cx="28" cy="-25" rx="15" ry="20" fill="#0f172a"/>
    <ellipse cx="28" cy="-25" rx="11" ry="15" fill="#0284c7"/>
    <circle cx="24" cy="-30" r="5" fill="#fff"/>
    <circle cx="32" cy="-18" r="2.5" fill="#fff"/>

    <!-- Anime Scholar Glasses -->
    <circle cx="-28" cy="-22" r="22" fill="none" stroke="#facc15" stroke-width="3"/>
    <circle cx="28" cy="-22" r="22" fill="none" stroke="#facc15" stroke-width="3"/>
    <line x1="-6" y1="-22" x2="6" y2="-22" stroke="#facc15" stroke-width="3"/>

    <!-- Anime Wizard Hat -->
    <g transform="translate(0, -75)">
      <path d="M-85 0 Q0 -25 85 0 L55 -110 Q0 -130 -55 -110 Z" fill="#1e1045" stroke="#facc15" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="90" ry="18" fill="#2e1065" stroke="#facc15" stroke-width="3"/>
      <!-- Gold Stars on Hat -->
      <polygon points="0,-70 3,-60 12,-60 5,-54 8,-44 0,-50 -8,-44 -5,-54 -12,-60 -3,-60" fill="#facc15" filter="url(#glow)"/>
    </g>

    <!-- Glowing Wand -->
    <g transform="translate(80, 20) rotate(-30)" filter="url(#intenseGlow)">
      <rect x="0" y="0" width="10" height="140" rx="5" fill="#78350f"/>
      <circle cx="5" cy="0" r="20" fill="#38bdf8"/>
      <polygon points="5,-35 12,-15 32,-15 17,0 23,20 5,7 -13,20 -7,0 -22,-15 -2,-15" fill="#facc15"/>
    </g>
  </g>

  <!-- RIGHT SIDE: Un-multiplying Castle -> Secret Ingredients -->
  <g transform="translate(800, 80)">
    <!-- Aura Plate -->
    <rect x="0" y="0" width="340" height="420" rx="24" fill="#1e1045" stroke="#ec4899" stroke-width="2" opacity="0.8"/>
    <text x="170" y="45" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="24" fill="#ec4899" text-anchor="middle">UN-MULTIPLYING (FACTORISING)</text>

    <!-- Castle Expression -->
    <g transform="translate(65, 80)" filter="url(#glow)">
      <rect x="0" y="0" width="210" height="55" rx="14" fill="#831843" stroke="#f472b6" stroke-width="2"/>
      <text x="105" y="36" font-family="sans-serif" font-weight="900" font-size="24" fill="#fff" text-anchor="middle">x² + 5x + 6</text>
    </g>

    <text x="170" y="180" font-family="sans-serif" font-weight="900" font-size="26" fill="#f472b6" text-anchor="middle">FACTORISE</text>
    <path d="M170 195 L170 235" stroke="#f472b6" stroke-width="4" stroke-dasharray="6,4" filter="url(#glow)"/>
    <polygon points="170,245 162,230 178,230" fill="#f472b6"/>

    <!-- Secret Ingredients (Factors) -->
    <g transform="translate(35, 260)" filter="url(#intenseGlow)">
      <circle cx="65" cy="65" r="55" fill="#065f46" stroke="#34d399" stroke-width="3"/>
      <text x="65" y="73" font-family="sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">(x + 2)</text>
    </g>
    <g transform="translate(175, 260)" filter="url(#intenseGlow)">
      <circle cx="65" cy="65" r="55" fill="#065f46" stroke="#34d399" stroke-width="3"/>
      <text x="65" y="73" font-family="sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">(x + 3)</text>
    </g>
  </g>

  <!-- Bottom Banner Pill -->
  <g transform="translate(300, 570)" filter="url(#glow)">
    <rect x="0" y="0" width="600" height="65" rx="32" fill="#160b36" stroke="#facc15" stroke-width="3"/>
    <text x="300" y="40" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="900" font-size="26" fill="#fde047" text-anchor="middle">✨ Expand = Multiply Out | Factorise = Un-Multiply! ✨</text>
  </g>
</svg>